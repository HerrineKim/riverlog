<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" fill="#1f2328">
  <title>소속 함수 μ_키큰(x): 160cm까지 0, 160~180cm에서 직선으로 올라 180cm 이상은 1</title>
  <rect x="0" y="0" width="660" height="360" fill="#ffffff"/>
  <g stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4">
    <line x1="90" y1="60" x2="590" y2="60"/>
    <line x1="90" y1="175" x2="590" y2="175"/>
    <line x1="215" y1="60" x2="215" y2="290"/>
    <line x1="340" y1="60" x2="340" y2="290"/>
    <line x1="465" y1="60" x2="465" y2="290"/>
  </g>
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="90" y1="290" x2="600" y2="290"/>
    <line x1="90" y1="290" x2="90" y2="40"/>
    <line x1="84" y1="60" x2="90" y2="60"/><line x1="84" y1="175" x2="90" y2="175"/><line x1="84" y1="290" x2="90" y2="290"/>
    <line x1="215" y1="290" x2="215" y2="296"/><line x1="340" y1="290" x2="340" y2="296"/><line x1="465" y1="290" x2="465" y2="296"/>
  </g>
  <polyline points="90,290 215,290 465,60 590,60" fill="none" stroke="#2f5fb3" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#57606a" text-anchor="end">
    <text x="78" y="65">1.0</text><text x="78" y="180">0.5</text><text x="78" y="295">0.0</text>
  </g>
  <g fill="#57606a" text-anchor="middle">
    <text x="215" y="316">160</text><text x="340" y="316">170</text><text x="465" y="316">180</text>
    <text x="600" y="316">(cm)</text>
  </g>
  <text x="90" y="28" font-weight="600">μ_키큰(x)</text>
</svg>
