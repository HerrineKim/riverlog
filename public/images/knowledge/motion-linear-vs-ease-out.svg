<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" fill="#1f2328">
  <title>모션 커브 비교: linear는 기울기가 일정해 등속이고, ease-out은 처음 가파르다가 끝에 평평해진다</title>
  <rect x="0" y="0" width="800" height="340" fill="#ffffff"/>
  <g stroke="#57606a" stroke-width="1.5" fill="none">
    <line x1="60" y1="270" x2="360" y2="270"/><line x1="60" y1="270" x2="60" y2="50"/>
    <polyline points="54,60 60,50 66,60"/><polyline points="350,264 360,270 350,276"/>
    <line x1="460" y1="270" x2="760" y2="270"/><line x1="460" y1="270" x2="460" y2="50"/>
    <polyline points="454,60 460,50 466,60"/><polyline points="750,264 760,270 750,276"/>
  </g>
  <g font-weight="600">
    <text x="60" y="38" text-anchor="middle">값</text><text x="360" y="296" text-anchor="end">시간</text>
    <text x="460" y="38" text-anchor="middle">값</text><text x="760" y="296" text-anchor="end">시간</text>
  </g>
  <line x1="60" y1="270" x2="320" y2="70" stroke="#2f5fb3" stroke-width="3" stroke-linecap="round"/>
  <path d="M460,270 C460,270 610.8,70 720,70" fill="none" stroke="#b35c00" stroke-width="3" stroke-linecap="round"/>
  <text x="210" y="80" font-weight="600" fill="#2f5fb3" text-anchor="end">linear</text>
  <text x="220" y="210" fill="#57606a">기울기 일정</text>
  <text x="220" y="232" fill="#57606a">= 등속</text>
  <text x="600" y="62" font-weight="600" fill="#b35c00" text-anchor="end">ease-out</text>
  <text x="560" y="200" fill="#57606a">처음 가파르고(빠름)</text>
  <text x="560" y="222" fill="#57606a">끝에 평평(느려짐)</text>
</svg>
